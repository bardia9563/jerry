name: jerry

on:
  schedule:
    - cron: "*/30 * * * *"  # just a wake-up; each run keeps scanning for hours
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: jerry
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Remember which listings were already seen between runs.
      - uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            chat_id.txt
            deals_seen.json
          key: jerry-${{ github.run_id }}
          restore-keys: jerry-

      # Scan every 5 minutes for about 5.5 hours, then the next run takes over.
      - name: Scan every 5 minutes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          git config user.name "jerry-bot"
          git config user.email "jerry-bot@users.noreply.github.com"
          end=$((SECONDS + 330*60))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            echo "===== scan at $(date -u +%H:%M) ====="
            timeout 240 python main.py || echo "scan failed, trying again next round"
            git add docs/alerts.json 2>/dev/null || true
            git diff --cached --quiet || (git commit -q -m "New alerts" && git pull -q --rebase && git push -q) || echo "push failed"
            left=$((300 - (SECONDS - start)))
            [ $left -gt 0 ] && sleep $left
          done

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            seen.json
            chat_id.txt
            deals_seen.json
          key: jerry-${{ github.run_id }}
