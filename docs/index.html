<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jerry</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jerry">
<meta name="theme-color" content="#050507">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<script>/* always load the newest files (phones cache them for ~10 min otherwise) */
window.V = Math.floor(Date.now() / 60000);
/* computers get a lighter map (less lag); phones keep full quality */
window.LOWQ = matchMedia('(pointer: fine)').matches && innerWidth >= 700;
if (LOWQ) document.documentElement.classList.add('lowq');
document.write('<link rel="stylesheet" href="style.css?v=' + V + '">');</script>
</head>
<body>
<header>
  <div class="title">JERRY / LANDSCAPE OF SIGNALS</div>
  <div class="sub">toronto · free + deals + lowprof · live</div>
  <div class="stats">
    <div><b id="s-today">0</b><span>today</span></div>
    <div><b id="s-free">0</b><span>free</span></div>
    <div><b id="s-deal">0</b><span>deals</span></div>
    <div><b id="s-low">0</b><span>lowprof</span></div>
    <div><b id="s-profit">$0</b><span>potential</span></div>
    <div class="earn" id="earn" title="Tap to change"><b id="s-earn">$0</b><span>earned/lost</span></div>
  </div>
</header>

<div id="nodes">
  <div class="node free" id="n-free"><i></i><b>FREE</b><span id="c-free">0</span></div>
  <div class="node low" id="n-low"><i></i><b>LOWPROF</b><span id="c-low">0</span></div>
  <div class="node deal" id="n-deal"><i></i><b>DEALS</b><span id="c-deal">0</span></div>
  <div class="node listed" id="n-listed"><i></i><b>LISTED</b><span id="c-listed">0</span></div>
</div>

<div id="stage"><div id="plane"><div id="tiles"></div><div id="grid"></div><div id="pts"></div></div></div>
<canvas id="fx"></canvas>

<div id="toast"></div>
<div id="demo" hidden>no alerts yet · showing demo signals</div>
<ul id="feed"></ul>
<div id="ticker"><span id="tick">waiting for signals…</span></div>

<script>
document.write('<script src="map.js?v=' + V + '"><\/script>');
document.write('<script src="app.js?v=' + V + '"><\/script>');
document.write('<script src="feed.js?v=' + V + '"><\/script>');
document.write('<script src="zoom.js?v=' + V + '"><\/script>');
document.write('<script src="buildings.js?v=' + V + '"><\/script>');
document.write('<script src="select.js?v=' + V + '"><\/script>');
document.write('<script src="push.js?v=' + V + '"><\/script>');
document.write('<script src="talk.js?v=' + V + '"><\/script>');
</script>
</body>
</html>
